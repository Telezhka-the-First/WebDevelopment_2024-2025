{% extends 'main/layout.html' %}

{% block title %}
    Форма обратной связи
{% endblock %}

{% block content %}
    <div class="features">
        <h1>Форма обратной связи</h1>

        <form method="post">
            {% csrf_token %}
            <!--{{ form.as_p }}-->
            <input type="text" placeholder="Тема" class="form-control"><br>
            <textarea placeholder="Обратная связь" class="form-control"></textarea><br>
            <span>{{ error }}</span>
            <button class="btn btn-success" type="submit">Отправить обратную связь</button>
        </form>
    </div>
{% endblock %}
