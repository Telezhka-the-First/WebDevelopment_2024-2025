</head>
<body>
    <header style="
        background: linear-gradient(90deg, #4a90e2, #357ABD);
        color: white;
        padding: 20px 15px;
        text-align: center;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        font-size: 1.4rem;
        font-weight: 700;
        border-radius: 8px;
        box-shadow: 0 4px 15px rgba(53, 122, 189, 0.4);
        user-select: none;
        ">
        Добро пожаловать на сайт по публикации статей!
    </header>


    <aside>
        <img src="{% static 'main/img/django-dark-logo.svg' %}" alt="Logo">
        <span class="logo">Джанго!</span>
        <h3>Навигация</h3>
        <ul>
            <a href ="{% url 'home' %}"><li><i class="fas fa-home"></i> Главная</li></a>
            <a href ="{% url 'about' %}"><li><i class="fas fa-address-card"></i> О нас</li></a>
            <a href ="{% url 'news_home' %}"><li><i class="fas fa-address-book"></i> Новости</li></a>
            <a href ="{% url 'feedback' %}"><li><i class="fas fa-paper-plane"></i> Обратная связь</li></a>
            <a href ="{% url 'create' %}"><li><button class="btn btn-info"><i class="fas fa-plus-circle"></i> Добавить статью</li></button></a>
        </ul>
    </aside>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        Сайт является выполнением лабораторной работы.
    </footer>
</body>
</html>
